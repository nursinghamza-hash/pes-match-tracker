<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PES Match Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#e5e7eb}
.container{max-width:1100px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#1d4ed8,#7c3aed);padding:28px;border-radius:20px;margin-bottom:18px}
h1,h2,h3,p{margin-top:0}.hero h1{font-size:30px;margin-bottom:8px}.muted{color:#cbd5e1}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tab{border:0;background:#1e293b;color:#cbd5e1;padding:12px 16px;border-radius:12px;cursor:pointer;white-space:nowrap}.tab.active{background:#2563eb;color:#fff}
.panel{background:#111827;border:1px solid #243244;border-radius:18px;padding:18px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.stat{background:#1e293b;padding:18px;border-radius:15px}.stat .n{font-size:28px;font-weight:700;margin-top:6px}
label{display:block;margin-bottom:6px;color:#cbd5e1}input,select,button{font:inherit}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff}
button.primary{background:#2563eb;color:#fff;border:0;padding:12px 18px;border-radius:10px;cursor:pointer}button.danger{background:#dc2626;color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}button.secondary{background:#334155;color:#fff;border:0;padding:10px 14px;border-radius:9px;cursor:pointer}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #243244;text-align:center}th{color:#93c5fd}.win{color:#4ade80;font-weight:700}.loss{color:#f87171;font-weight:700}.draw{color:#facc15;font-weight:700}
.search{margin-bottom:12px}.empty{color:#94a3b8;text-align:center;padding:25px}.small{font-size:13px;color:#94a3b8}
.hidden{display:none}.player-card{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#1e293b;padding:14px;border-radius:12px;margin-bottom:8px}
@media(max-width:600px){.container{padding:12px}.hero{padding:20px}.hero h1{font-size:24px}th,td{padding:8px 4px;font-size:13px}}
</style>
</head>
<body>
<div class="container">
  <div class="hero">
    <h1>⚽ PES Match Tracker</h1>
    <p class="muted">سجل مباريات PES واحسب المواجهات والإحصائيات تلقائياً.</p>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="dashboard">الرئيسية</button>
    <button class="tab" data-tab="match">➕ مباراة جديدة</button>
    <button class="tab" data-tab="matches">🎮 المباريات</button>
    <button class="tab" data-tab="players">👥 اللاعبين</button>
    <button class="tab" data-tab="head">📊 مواجهة لاعبين</button>
    <button class="tab" data-tab="backup">💾 نسخ احتياطي</button>
  </div>

  <section id="dashboard" class="page">
    <div class="grid" id="stats"></div>
    <div class="panel"><h2>آخر المباريات</h2><div id="recent"></div></div>
  </section>

  <section id="match" class="page hidden">
    <div class="panel">
      <h2>تسجيل مباراة</h2>
      <div class="form-grid">
        <div><label>اللاعب الأول</label><select id="p1"></select></div>
        <div><label>أهداف اللاعب الأول</label><input id="s1" type="number" min="0" value="0"></div>
        <div><label>اللاعب الثاني</label><select id="p2"></select></div>
        <div><label>أهداف اللاعب الثاني</label><input id="s2" type="number" min="0" value="0"></div>
        <div><label>التاريخ</label><input id="date" type="date"></div>
      </div>
      <div class="actions"><button class="primary" onclick="addMatch()">حفظ المباراة</button></div>
      <p class="small" id="matchMsg"></p>
    </div>
  </section>

  <section id="matches" class="page hidden">
    <div class="panel">
      <h2>كل المباريات</h2>
      <input class="search" id="matchSearch" placeholder="ابحث باسم لاعب..." oninput="renderMatches()">
      <div id="matchTable"></div>
    </div>
  </section>

  <section id="players" class="page hidden">
    <div class="panel">
      <h2>إضافة لاعب</h2>
      <div class="form-grid"><div><label>اسم اللاعب</label><input id="newPlayer" placeholder="مثال: حمزة"></div></div>
      <div class="actions"><button class="primary" onclick="addPlayer()">إضافة</button></div>
    </div>
    <div class="panel"><h2>اللاعبون</h2><div id="playerList"></div></div>
  </section>

  <section id="head" class="page hidden">
    <div class="panel">
      <h2>مواجهة لاعبين</h2>
      <div class="form-grid"><div><label>اللاعب الأول</label><select id="h1"></select></div><div><label>اللاعب الثاني</label><select id="h2"></select></div></div>
      <div class="actions"><button class="primary" onclick="renderHead()">عرض الإحصائيات</button></div>
    </div>
    <div id="headResult"></div>
  </section>

  <section id="backup" class="page hidden">
    <div class="panel">
      <h2>النسخ الاحتياطي</h2>
      <p class="muted">البيانات محفوظة في هذا المتصفح. استخدم التصدير للاحتفاظ بنسخة، والاستيراد لنقلها إلى جهاز آخر.</p>
      <div class="actions">
        <button class="primary" onclick="exportData()">تصدير البيانات</button>
        <label class="secondary" style="display:inline-block;padding:10px 14px;cursor:pointer">استيراد البيانات <input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)"></label>
        <button class="danger" onclick="resetData()">حذف كل البيانات</button>
      </div>
    </div>
  </section>
</div>

<script>
const KEY='pes_match_tracker_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'{"players":[],"matches":[]}');
const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));refresh();};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const today=new Date().toISOString().slice(0,10); document.getElementById('date').value=today;

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden');refresh();});

function addPlayer(){
  const n=document.getElementById('newPlayer').value.trim();
  if(!n)return alert('اكتب اسم اللاعب');
  if(db.players.some(p=>p.toLowerCase()===n.toLowerCase()))return alert('هذا اللاعب موجود بالفعل');
  db.players.push(n);document.getElementById('newPlayer').value='';save();
}
function addMatch(){
  const a=document.getElementById('p1').value,b=document.getElementById('p2').value;
  const s1=+document.getElementById('s1').value,s2=+document.getElementById('s2').value,date=document.getElementById('date').value||today;
  if(!a||!b||a===b)return alert('اختر لاعبين مختلفين');
  db.matches.push({id:Date.now(),p1:a,p2:b,s1,s2,date});save();
  document.getElementById('matchMsg').textContent='تم حفظ المباراة بنجاح ✅';
}
function fillSelect(id){
  const el=document.getElementById(id), old=el.value;
  el.innerHTML='<option value="">اختر...</option>'+db.players.map(p=>`<option>${esc(p)}</option>`).join('');
  if(db.players.includes(old))el.value=old;
}
function result(m,who){
  const my=who===m.p1?m.s1:m.s2,op=who===m.p1?m.s2:m.s1;
  return my>op?'فوز':my<op?'خسارة':'تعادل';
}
function renderStats(){
  const total=db.matches.length,w=db.matches.filter(m=>m.s1>m.s2).length,l=db.matches.filter(m=>m.s1<m.s2).length,d=total-w-l;
  const goals=db.matches.reduce((a,m)=>a+m.s1+m.s2,0);
  document.getElementById('stats').innerHTML=[
    ['🎮','مجموع المباريات',total],['🏆','الانتصارات',w],['🤝','التعادلات',d],['❌','الخسائر',l],['⚽','مجموع الأهداف',goals],['👥','عدد اللاعبين',db.players.length]
  ].map(x=>`<div class="stat"><div>${x[0]} ${x[1]}</div><div class="n">${x[2]}</div></div>`).join('');
}
function renderRecent(){
  const arr=[...db.matches].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,5);
  document.getElementById('recent').innerHTML=arr.length?`<table><tr><th>التاريخ</th><th>المباراة</th><th>النتيجة</th></tr>${arr.map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.p1)} × ${esc(m.p2)}</td><td>${m.s1} - ${m.s2}</td></tr>`).join('')}</table>`:'<div class="empty">لا توجد مباريات بعد.</div>';
}
function renderMatches(){
  const q=(document.getElementById('matchSearch')?.value||'').toLowerCase();
  const arr=[...db.matches].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).filter(m=>(m.p1+' '+m.p2).toLowerCase().includes(q));
  document.getElementById('matchTable').innerHTML=arr.length?`<table><tr><th>التاريخ</th><th>اللاعب 1</th><th>النتيجة</th><th>اللاعب 2</th><th>حذف</th></tr>${arr.map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.p1)}</td><td>${m.s1} - ${m.s2}</td><td>${esc(m.p2)}</td><td><button class="danger" onclick="deleteMatch(${m.id})">حذف</button></td></tr>`).join('')}</table>`:'<div class="empty">لا توجد مباريات مطابقة.</div>';
}
function deleteMatch(id){if(confirm('حذف المباراة؟')){db.matches=db.matches.filter(m=>m.id!==id);save();}}
function renderPlayers(){
  document.getElementById('playerList').innerHTML=db.players.length?db.players.map(p=>{
    const n=db.matches.filter(m=>m.p1===p||m.p2===p).length;
    return `<div class="player-card"><span><b>${esc(p)}</b><br><span class="small">${n} مباراة</span></span><button class="danger" onclick="deletePlayer('${encodeURIComponent(p)}')">حذف</button></div>`;
  }).join(''):'<div class="empty">أضف أول لاعب.</div>';
}
function deletePlayer(enc){
  const p=decodeURIComponent(enc);
  if(db.matches.some(m=>m.p1===p||m.p2===p))return alert('لا يمكن حذف لاعب لديه مباريات مسجلة. احذف مبارياته أولاً.');
  if(confirm('حذف اللاعب؟')){db.players=db.players.filter(x=>x!==p);save();}
}
function renderHead(){
  const a=document.getElementById('h1').value,b=document.getElementById('h2').value;
  if(!a||!b||a===b)return alert('اختر لاعبين مختلفين');
  const ms=db.matches.filter(m=>(m.p1===a&&m.p2===b)||(m.p1===b&&m.p2===a));
  let w=0,d=0,l=0,ga=0,gb=0;
  ms.forEach(m=>{const sa=m.p1===a?m.s1:m.s2,sb=m.p1===a?m.s2:m.s1;ga+=sa;gb+=sb;if(sa>sb)w++;else if(sa<sb)l++;else d++;});
  document.getElementById('headResult').innerHTML=`<div class="panel"><h2>${esc(a)} × ${esc(b)}</h2><div class="grid"><div class="stat"><div>🏆 فوز ${esc(a)}</div><div class="n">${w}</div></div><div class="stat"><div>🤝 تعادل</div><div class="n">${d}</div></div><div class="stat"><div>❌ فوز ${esc(b)}</div><div class="n">${l}</div></div><div class="stat"><div>🎮 المجموع</div><div class="n">${ms.length}</div></div><div class="stat"><div>⚽ أهداف ${esc(a)}</div><div class="n">${ga}</div></div><div class="stat"><div>⚽ أهداف ${esc(b)}</div><div class="n">${gb}</div></div></div></div>`;
}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pes-match-backup.json';a.click();URL.revokeObjectURL(a.href);}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.players)||!Array.isArray(x.matches))throw 0;db=x;save();alert('تم استيراد البيانات');}catch{alert('ملف غير صالح');}};r.readAsText(f);}
function resetData(){if(confirm('سيتم حذف جميع اللاعبين والمباريات. هل أنت متأكد؟')){db={players:[],matches:[]};save();}}
function refresh(){['p1','p2','h1','h2'].forEach(fillSelect);renderStats();renderRecent();renderMatches();renderPlayers();}
refresh();
</script>
</body>
</html>
